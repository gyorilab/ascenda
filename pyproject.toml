requires-python = ">=3.10"
dependencies = ["gilda>=1.5.0,<1.6", "torch", "transformers", "numpy", "pandas", "pyarrow", "tqdm", "pystow"]

[tool.setuptools.packages.find]
include = ["ascenda*"]
